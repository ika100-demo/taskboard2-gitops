apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: taskboard2-dev
  namespace: argocd
spec:
  generators:
  - list:
      elements:
      - name: taskboard2-api
      - name: taskboard2-web
  template:
    metadata:
      name: '{{name}}-dev'
    spec:
      project: default
      source:
        repoURL: https://github.com/ika100-demo/taskboard2-gitops
        targetRevision: main
        path: applications/taskboard2/overlays/dev/{{name}}
      destination:
        server: https://kubernetes.default.svc
        namespace: taskboard2-dev
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
---
