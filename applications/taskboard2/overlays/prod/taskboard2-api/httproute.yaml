apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: taskboard2-api
  labels:
    app: taskboard2-api
    app.kubernetes.io/name: taskboard2-api
    app.kubernetes.io/part-of: taskboard2
    app.kubernetes.io/managed-by: gitops-app
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: kube-system
  hostnames:
  - taskboard2-api.taskboard2-prod.localhost
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: taskboard2-api
      port: 80
